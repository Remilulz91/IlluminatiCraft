plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '0.7.4'
}

group = project.maven_group

// Build type: 'public' (default, debug commands OFF) or 'debug' (debug commands ON)
// Usage: ./gradlew build                   -> public build
//        ./gradlew build -PbuildType=debug -> debug build (separate JAR with -debug version suffix)
def buildType = project.findProperty('buildType') ?: 'public'

version = buildType == 'debug'
        ? "${project.mod_version}-debug"
        : project.mod_version

base {
    archivesName = project.archives_base_name
}

println "==> Building IlluminatiCraft v${version} (type: ${buildType})"

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    mavenCentral()
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config - configuration screens
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu - in-game mod list
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "buildType", buildType

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    filesMatching("illuminaticraft.build.properties") {
        expand "build_type": buildType,
                "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    // CC BY 4.0 requires the attribution to travel with the redistributed file,
    // so CREDITS.md is bundled inside the JAR.
    from("CREDITS.md")
}

// Extracts only the current version's section from CHANGELOG.md, so the Modrinth
// release notes describe this version instead of repeating the whole file.
def versionChangelog = providers.provider {
    File file = rootProject.file("CHANGELOG.md")
    if (!file.exists()) {
        return "No changelog provided."
    }
    List<String> section = []
    boolean capturing = false
    for (String line : file.readLines()) {
        if (line.startsWith("## ")) {
            if (capturing) break
            if (line.contains(project.mod_version)) {
                capturing = true
            }
            continue
        }
        if (capturing) {
            section << line
        }
    }
    String text = section.join("\n").trim()
    text.isEmpty() ? file.text : text
}

// Modrinth publishing — run with: ./gradlew publishMods
// Requires the MODRINTH_TOKEN environment variable.
publishMods {
    file = remapJar.archiveFile
    displayName = "IlluminatiCraft ${project.mod_version}"
    version = project.mod_version
    changelog = versionChangelog
    type = STABLE
    modLoaders.add("fabric")

    // The plugin requires the 8-character Modrinth project ID, NOT the slug.
    // Find it on the project page sidebar ("Project ID") or in Settings -> General.
    // Leave modrinth_project_id empty in gradle.properties to skip Modrinth entirely.
    if (project.findProperty("modrinth_project_id")?.trim()) {
        logger.lifecycle("==> Modrinth publishing enabled for project ${project.modrinth_project_id.trim()}")
        modrinth {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = project.modrinth_project_id.trim()
            minecraftVersions.add(project.minecraft_version)
            requires {
                slug = "fabric-api"
            }
            optional {
                slug = "cloth-config"
            }
            optional {
                slug = "modmenu"
            }
        }
    } else {
        logger.lifecycle("==> modrinth_project_id is empty, skipping Modrinth publishing")
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here if needed
    }
}
