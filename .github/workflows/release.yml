name: Release

# Triggered by pushing a tag starting with "v" (e.g. v0.1.2):
#   git tag v0.1.2 && git push origin v0.1.2
#
# Creates the GitHub Release, then publishes to Modrinth.
# The release ships the PUBLIC jar only. The debug jar is intentionally left out of
# public downloads; it stays available as a Build workflow artifact (Actions tab) or
# by building locally with: ./gradlew build -PbuildType=debug
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Empty when the secret is not configured; the Modrinth step is skipped then.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Fabric Loom 1.7 is NOT compatible with Gradle 9. The committed wrapper pins
      # Gradle 8.10; gradle/actions/setup-gradle is avoided on purpose because it
      # falls back to its own Gradle 9.x whenever ./gradlew is unusable.
      - name: Prepare Gradle wrapper
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading..."
            curl -sSL --fail -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          fi
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null || { echo "invalid gradle-wrapper.jar"; exit 1; }
          ./gradlew --version

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      # Keep the mod jar only: no -sources.jar (GitHub already attaches the source
      # archives to the release) and no debug variant.
      - name: Collect release assets
        run: |
          mkdir -p release-artifacts
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} release-artifacts/ \;
          ls -l release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.jar
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs last so a Modrinth hiccup never costs the GitHub release.
      # Skipped entirely when the MODRINTH_TOKEN secret is not set.
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        run: ./gradlew publishMods --stacktrace
