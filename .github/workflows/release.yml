name: Release

# Se declenche quand tu pousses un tag commencant par "v" (ex : v0.1.0)
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Prepare Gradle wrapper
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL --fail -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          fi
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null || { echo "gradle-wrapper.jar invalide"; exit 1; }
          ./gradlew --version

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      - name: Stash public JAR
        run: |
          mkdir -p release-artifacts
          cp build/libs/*.jar release-artifacts/

      - name: Build DEBUG variant
        run: ./gradlew clean build -PbuildType=debug --stacktrace

      - name: Stash debug JAR
        run: cp build/libs/*.jar release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.jar
          body_path: CHANGELOG.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
