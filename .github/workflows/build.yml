name: Build

# Builds both variants on every push. Both jars are uploaded as workflow artifacts:
# this is where the debug jar lives, instead of in the public releases.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Fabric Loom 1.7 is NOT compatible with Gradle 9. The committed wrapper pins
      # Gradle 8.10; gradle/actions/setup-gradle is avoided on purpose because it
      # falls back to its own Gradle 9.x whenever ./gradlew is unusable.
      - name: Prepare Gradle wrapper
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading..."
            curl -sSL --fail -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          fi
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null || { echo "invalid gradle-wrapper.jar"; exit 1; }
          ./gradlew --version

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      - name: Save public JAR
        run: |
          mkdir -p artifacts
          cp build/libs/*.jar artifacts/

      - name: Build DEBUG variant
        run: ./gradlew clean build -PbuildType=debug --stacktrace

      - name: Save debug JAR
        run: cp build/libs/*.jar artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: illuminaticraft-build
          path: artifacts/*.jar
          retention-days: 14
